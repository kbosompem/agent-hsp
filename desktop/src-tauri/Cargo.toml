[package]
name = "amc-preso"
version = "0.1.0"
edition = "2021"

[lib]
name = "amc_preso_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
preso-core = { path = "../crates/preso-core" }
cpal = "0.15"
whisper-rs = "0.13"
ureq = "2"
