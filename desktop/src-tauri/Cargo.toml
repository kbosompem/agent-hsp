[package]
name = "agent-hsp"
version = "0.1.0"
edition = "2021"

[lib]
name = "agent_hsp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
preso-core = { path = "../crates/preso-core" }
cpal = "0.15"
whisper-rs = "0.13"
ureq = "2"

# GPU inference on Apple Silicon. Windows stays on CPU.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.13", features = ["metal"] }
