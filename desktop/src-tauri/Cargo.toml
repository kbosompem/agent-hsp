[package]
name = "agent-hsp"
version = "0.2.0"
edition = "2021"

[lib]
name = "agent_hsp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
preso-core = { path = "../crates/preso-core" }
cpal = "0.15"
whisper-rs = "0.13"
ureq = "2"
tauri-plugin-dialog = "2"
# Service bundles (.hspbundle) are zip files.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Deepgram live speech-to-text (websocket over rustls).
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
# Nemotron streaming speech model via sherpa-onnx (optional; needs the native
# libraries from scripts/sherpa/build.sh). Pinned to main for streaming
# hotword support, which is newer than the v1.13.8 release.
sherpa-onnx = { git = "https://github.com/k2-fsa/sherpa-onnx", rev = "99ddefaa92129858b80a71a426903dd4215c83fa", optional = true }
# Unpacking the Nemotron model download (.tar.bz2) without a system tar.
tar = { version = "0.4", optional = true }
bzip2 = { version = "0.4", optional = true }

[features]
nemotron = ["dep:sherpa-onnx", "dep:tar", "dep:bzip2"]

# GPU inference on Apple Silicon. Windows stays on CPU.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.13", features = ["metal"] }
# The projector's WKWebView setting that keeps motion backgrounds playing (projector.rs).
objc2 = "0.6"
