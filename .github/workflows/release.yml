name: release

# Push a tag like v0.2.0 to build the installers and attach them to a
# draft GitHub Release. A maintainer reviews the draft and publishes it.
# See docs/RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The quote-matching index (about 47 MB) is not in git. Build it once,
  # cache it, and hand it to both installer builds.
  verse-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: desktop/public/verse-index.bin
          key: verse-index-${{ hashFiles('desktop/crates/preso-core/kjv.json', 'scripts/verse-index/build.js', 'scripts/verse-index/package-lock.json') }}
      - name: Build verse index
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: scripts/verse-index
        run: |
          npm ci
          node build.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verse-index
          path: desktop/public/verse-index.bin
          if-no-files-found: error

  build:
    needs: verse-index
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --bundles dmg --features nemotron
            asset: Agent-HSP-macOS.dmg
            pattern: desktop/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            args: --bundles nsis --features nemotron
            asset: Agent-HSP-Windows-setup.exe
            pattern: desktop/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verse-index
          path: desktop/public
      # Native libraries for the Nemotron speech engine (sherpa-onnx), built
      # from the pinned commit in scripts/sherpa/build.sh. Slow, so cached.
      - id: sherpa-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: desktop/vendor/sherpa-onnx
          key: sherpa-${{ runner.os }}-${{ hashFiles('scripts/sherpa/build.sh') }}
      - name: Build sherpa-onnx
        if: steps.sherpa-cache.outputs.cache-hit != 'true'
        shell: bash
        run: scripts/sherpa/build.sh
      # Ship the Microsoft C++ runtime next to agent-hsp.exe (Microsoft allows
      # this app-local copy). Nemotron's libraries need a newer runtime than
      # many laptops have, and without it the app does not start at all.
      # tauri.windows.conf.json lists these files.
      - name: Copy C++ runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1
          Write-Host "C++ runtime from $($crt.FullName)"
          New-Item -ItemType Directory -Force desktop/src-tauri/vcrt | Out-Null
          foreach ($f in "msvcp140.dll","msvcp140_1.dll","msvcp140_2.dll","vcruntime140.dll","vcruntime140_1.dll") {
            Copy-Item (Join-Path $crt.FullName $f) desktop/src-tauri/vcrt/
          }
      - name: Install frontend deps
        working-directory: desktop
        run: npm install
      - name: Build installer and attach to draft release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: Agent HSP ${{ github.ref_name }}
          releaseBody: |
            See CHANGELOG.md for what changed.

            These installers are not signed yet.
            Windows: SmartScreen will warn you. Click "More info", then "Run anyway".
            macOS: open System Settings > Privacy & Security and click "Open Anyway".
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
      # A second copy under a name that never changes, so websites can link to
      # https://github.com/kbosompem/agent-hsp/releases/latest/download/<asset>
      - name: Attach installer under a fixed name
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp ${{ matrix.pattern }} "${{ matrix.asset }}"
          gh release upload "${{ github.ref_name }}" "${{ matrix.asset }}" --clobber
