name: build

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop
      - id: index-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: desktop/public/verse-index.bin
          key: verse-index-${{ hashFiles('desktop/crates/preso-core/kjv.json', 'scripts/verse-index/build.js', 'scripts/verse-index/package-lock.json') }}
      - name: Build verse quote index
        if: steps.index-cache.outputs.cache-hit != 'true'
        working-directory: scripts/verse-index
        run: |
          npm ci
          node build.js
      - name: Install frontend deps
        working-directory: desktop
        run: npm install
      - name: Build app (macOS dmg / Windows installer)
        working-directory: desktop
        run: npm run tauri build
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preso-${{ matrix.os }}
          path: |
            desktop/target/release/bundle/dmg/*.dmg
            desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
