name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Install frontend deps
        working-directory: desktop
        run: npm install
      - name: Build app (macOS dmg / Windows installer)
        working-directory: desktop
        run: npm run tauri build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: preso-${{ matrix.os }}
          path: |
            desktop/target/release/bundle/dmg/*.dmg
            desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
